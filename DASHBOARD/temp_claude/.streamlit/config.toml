[server]
# Imprescindible para que el iframe no quede en blanco
enableCORS = false
enableXsrfProtection = false
headless = true
port = 8501

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#667eea"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#e8eaf0"
font = "sans serif"
